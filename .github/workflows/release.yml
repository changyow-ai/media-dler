name: release

# Publishes signed per-ABI (+ universal) APKs to the GitHub Releases page.
# Trigger by pushing a tag like v0.1.0, or run manually (artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Assemble signed release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List built APKs
        run: ls -la app/build/outputs/apk/release/

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media-dler-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to the Releases page
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
