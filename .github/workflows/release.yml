name: release

# Builds signed per-ABI (+ universal) APKs and uploads them as an Actions
# artifact ONLY -- they are NOT published to the public Releases page.
# Project collaborators grab the APKs from the workflow run's "Artifacts"
# section. (Note: on a public repo the artifact is still downloadable by
# anyone; making it truly collaborator-only requires a private repo.)
# - push a tag vX.Y.Z / push to the build branch / run manually -> build + artifact
on:
  push:
    branches: ["claude/serene-dirac-jGhvp"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # whisper.cpp (the native engine :app's CMake build compiles) is a submodule.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # :app's whisper.cpp native build needs the pinned NDK + CMake, or Gradle
          # fails at project configuration (even for :core tasks).
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;23.2.8568313" "cmake;3.22.1"

      # sherpa-onnx's runtime .so (libsherpa-onnx-jni.so + libonnxruntime.so) are
      # prebuilt downloads, NOT a submodule and NOT committed (jniLibs is gitignored).
      # Without this the APK ships no sherpa libs and the on-device sherpa engine
      # (SenseVoice/Paraformer/Qwen3) crashes at runtime: dlopen "libsherpa-onnx-jni.so" not found.
      - name: Fetch sherpa-onnx prebuilt native libs
        run: bash scripts/fetch-sherpa-libs.sh

      - name: Assemble signed release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List built APKs
        run: ls -la app/build/outputs/apk/release/

      - name: Upload signed release APKs (Actions artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: media-dler-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
