name: release

# Publishes signed per-ABI (+ universal) APKs to the GitHub Releases page.
# - push a tag vX.Y.Z  -> a normal release with that version
# - push to the dev branch / run manually -> a rolling "dev" pre-release
# The action creates the tag/release server-side via GITHUB_TOKEN, so no
# local tag push is needed.
on:
  push:
    branches: ["claude/serene-dirac-jGhvp"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # :app's whisper.cpp native build needs the pinned NDK + CMake, or Gradle
          # fails at project configuration (even for :core tasks).
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;23.2.8568313" "cmake;3.22.1"

      - name: Assemble signed release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List built APKs
        run: ls -la app/build/outputs/apk/release/

      - name: Determine release tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "name=Development build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APKs to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
