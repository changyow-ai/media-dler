name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # :app's whisper.cpp native build needs the pinned NDK + CMake, or Gradle
          # fails at project configuration (even for :core tasks).
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;23.2.8568313" "cmake;3.22.1"

      - name: Run :core unit tests (red/green gate)
        run: ./gradlew :core:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: media-dler-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
